name: pre-commit
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: prek
        run: nix develop -c prek run --all-files --show-diff-on-failure
        env:
          # Avoids GitHub API rate limits when tenv installs terraform.
          TENV_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
